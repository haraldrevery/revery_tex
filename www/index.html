<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Revery TeX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 'wasm-unsafe-eval' is required for the engine. Keep in sync with
     tauri/tauri.conf.json — a mismatch shows up only at runtime, as a refusal
     to instantiate WebAssembly.

     No 'unsafe-inline' in script-src, and nothing on this page needs it: there
     is no inline <script> and no inline handler. settings_boot.js is an
     external classic script for exactly this reason. It was granted here and
     not in the Tauri config, which meant the browser build ran with its main
     XSS protection off while the desktop build did not. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'self'">
<link rel="stylesheet" href="./css_aesthetics/theme.css">
<!-- Before the stylesheet paints anything: sets the persisted theme and scales,
     so the app does not flash the default theme first. Must stay a blocking
     classic script — a module would be deferred and run too late. -->
<script src="./jvscrpt_and_css_extra/settings_boot.js"></script>
<script src="./jvscrpt_and_css_extra/codemirror-bundle.js"></script>
</head>
<body>

<div id="topbar">
  <button id="open">Open folder</button>
  <button id="importzip">Import zip</button>
  <input type="file" id="zipinput" accept=".zip,application/zip" hidden>
  <button id="exportzip" disabled title="Download the whole project as a zip">Export zip</button>
  <!-- Buttons, not <select>: a native list draws the OS popup in system fonts,
       ignoring the theme, and cannot show the ■ marker the menus use. -->
  <button id="project" data-label="Project"></button>
  <span class="lbl">Engine</span>
  <button id="engine" data-label="Engine"></button>
  <button id="save" disabled title="Ctrl+S">Save</button>
  <button id="compile" class="primary" title="Ctrl+Enter">Compile</button>
  <button id="autocompile" title="Compile after save">Auto</button>
  <span id="docname" class="docname"></span>
  <div class="spacer"></div>
  <button id="status" class="statusline">idle</button>
  <button id="outlinetoggle" title="Show the document outline">Outline</button>
  <button id="toolbox" title="Insert and format">Toolbox ▾</button>
  <button id="settings" title="Appearance and behaviour">Settings ▾</button>
</div>

<div id="notice" hidden></div>

<div id="workspace">
  <aside id="sidebar">
    <div class="panehead"><span>Files</span><div class="spacer"></div><span id="filecount" class="dim"></span>
      <button id="newfile" title="New file or folder">+</button></div>
    <!-- A labelled group of buttons, not role="tree": see renderTree() for why
         the tree pattern is not claimed here. -->
    <div id="filetree" role="group" aria-label="Project files"></div>
  </aside>
  <div class="vdiv" data-resize="sidebar"></div>

  <section id="editorpane">
    <div class="panehead"><span id="editortitle">no file</span><div class="spacer"></div><span id="dirty" class="dim"></span></div>
    <div id="editor"></div>
  </section>
  <div class="vdiv" data-resize="editor"></div>

  <section id="pdfpane">
    <div class="panehead"><span>PDF</span><div class="spacer"></div><span id="pdfmeta" class="dim"></span>
      <button id="pdfback" disabled title="Back to where you followed a link from (Alt+Left)">Back</button>
      <button id="savepdf" disabled>Download</button></div>
    <div id="pdfempty">no output yet</div>
    <div id="pdf" role="document" aria-label="PDF preview"></div>
  </section>

  <!-- Right of the PDF on purpose: clicking a heading moves the cursor *and*
       the preview, so the two want to be next to each other. Toggled from the
       topbar; the pane and its divider are hidden together. -->
  <div class="vdiv" data-resize="outline"></div>
  <aside id="outlinepane">
    <div class="panehead"><span>Outline</span><div class="spacer"></div><span id="outlinecount" class="dim"></span></div>
    <div id="outline" role="group" aria-label="Document outline"></div>
  </aside>
</div>

<div class="hdiv" id="paneldiv"></div>

<div id="panel">
  <div class="panelhead">
    <button class="tab active" data-tab="issues">Issues <span id="issuecount" class="dim"></span></button>
    <button class="tab" data-tab="raw">Raw log</button>
    <div class="spacer"></div>
    <span id="logmeta" class="dim"></span>
    <button id="copylog">Copy</button>
    <button id="savelog">Download .log</button>
    <button id="togglepanel">Hide</button>
  </div>
  <div id="issues" class="tabbody"></div>
  <div id="raw" class="tabbody hidden"></div>
</div>

<script type="module" src="./jvscrpt_and_css_extra/revery_tex_app.js"></script>
</body>
</html>
