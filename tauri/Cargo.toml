[package]
name    = "revery-tex"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# A deliberately small filesystem surface (Phase C): open a folder, list it,
# read, write atomically, crash backups. Revery Notebook's main.rs is ~40
# commands; a LaTeX editor needs nine.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Backup filenames only. std's DefaultHasher is explicitly not stable across
# Rust releases, so a toolchain bump would have re-keyed every crash backup —
# see backup_key in src/main.rs.
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto       = "thin"
panic     = "abort"
