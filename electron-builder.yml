# Electron packaging.
#
# In a YAML file rather than package.json's "build" key because the two
# decisions below need explaining, electron-builder rejects unknown properties
# (so a "//comment" key fails the build), and JSON has no comments.

appId: com.haraldrevery.tex
productName: Revery TeX
copyright: Copyright © Harald Revery

directories:
  output: dist-electron

# asar MUST stay off.
#
# The custom protocol serves www/ with net.fetch(pathToFileURL(...)), and
# Chromium's file:// handler does not understand asar archives. Node's fs does
# — which is why this looks like it should work — but that code path never
# touches fs. With asar on, every asset 404s and the engine cannot start.
# There is nothing to gain either way: the payload is 97 MB of wasm and texmf
# that asar would not compress.
asar: false

# A whitelist, because the default is "everything not excluded" and this repo
# contains www/engine/busytex/ — 649 MB of upstream release, gitignored, and
# sitting directly beside the 97 MB that does ship. An installer that silently
# grew sevenfold is the failure being prevented here.
files:
  - package.json
  # AGPL section 6 requires the licence and the written source offer to travel
  # with the binary, and Apache section 4(d) requires NOTICE. FONT-LICENSE.txt
  # is listed by hand because font/ is otherwise entirely outside this
  # whitelist -- only www/fonts/ ships, and that carries no terms.
  - LICENSE
  - LICENSE-APACHE
  - LICENSE-ASSETS
  - NOTICE
  - font/FONT-LICENSE.txt
  - electron/**/*
  - www/**/*
  - "!www/engine/busytex${/*}"
  - "!www/engine/*.tar.gz"
  - "!**/*.map"

linux:
  # Pairs with `desktopName` in package.json. Without both, the desktop
  # environment may not associate the running window with the .desktop entry,
  # so the taskbar shows a generic icon instead of the app's.
  syncDesktopName: true
  target:
    - deb
    - rpm
  category: Office
  icon: tauri/icons/icon.png
  maintainer: Harald Revery <harald.thirslund@gmail.com>
  synopsis: Local-first LaTeX editor
  description: >-
    Edit, compile and preview LaTeX entirely on your own machine. Bundles
    TeX Live 2026 compiled to WebAssembly, so there is no server, no account
    and no network.
  # `desktopEntry` in older electron-builder; renamed to `mimeTypes` by v26,
  # and an unknown key here fails the build with only "linux should be null".
  mimeTypes:
    - text/x-tex
    - application/x-tex
    - text/x-latex

deb:
  priority: optional

# The `files:` whitelist above is platform-independent, so the Windows targets
# inherit it unchanged — including the busytex exclusion. That is the point of
# it being a whitelist: a new target cannot quietly ship a different payload.
#
# `msi` downloads the WiX toolset on first use, so the first Windows build needs
# network. Both targets are built by `npm run installers` when it runs on
# Windows; neither can be cross-built from Linux.
win:
  target:
    - nsis
    - msi
  icon: tauri/icons/icon.ico

nsis:
  # Not one-click. The payload is ~120 MB of wasm and texmf, and a one-click
  # installer shows no progress and offers no directory choice — the wrong shape
  # for something that size, on a machine where 120 MB may not be free.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user, so installing needs no elevation. The app writes only to the
  # project directory the user picks, so there is nothing a machine-wide install
  # would buy.
  perMachine: false
